<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio Widget — Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --grey: #3A3A38;
    --offwhite: #EBEAE1;
    --white: #FFFFFF;
    --teal-deep: #04888A;
    --teal-vivid: #8EBEB1;
    --orange-deep: #F37944;
    --orange-vivid: #FFB500;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Archivo',Arial,sans-serif;
    color:var(--grey);
    background:var(--offwhite);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .stage{
    position:relative;
    width:min(560px, 90vw);
    padding:56px 48px;
    background:var(--white);
    border:1px solid rgba(58,58,56,0.12);
  }

  .mark{
    position:absolute;
    top:-18px;
    left:48px;
    width:36px;
    height:36px;
  }

  .eyebrow-shapes{
    display:flex;
    gap:8px;
    margin-bottom:24px;
  }
  .eyebrow-shapes span{
    display:block;
    width:22px;
    height:8px;
  }
  .eyebrow-shapes span:nth-child(1){background:var(--teal-deep);}
  .eyebrow-shapes span:nth-child(2){background:var(--orange-vivid);}
  .eyebrow-shapes span:nth-child(3){background:var(--teal-vivid);}
  .eyebrow-shapes span:nth-child(4){background:var(--orange-deep);}

  h1{
    font-size:30px;
    font-weight:500;
    line-height:1.25;
    margin:0 0 14px;
    max-width:22ch;
  }

  p{
    font-size:15px;
    line-height:1.6;
    color:#5a5a57;
    margin:0 0 32px;
    max-width:40ch;
  }

  .status{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    font-weight:700;
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--teal-deep);
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }

  @media (max-width:480px){
    .stage{padding:40px 28px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>

<div class="stage">
  <svg class="mark" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="17" height="17" fill="#04888A"/>
    <rect x="19" y="0" width="17" height="17" fill="#F37944"/>
    <rect x="0" y="19" width="17" height="17" fill="#FFB500"/>
    <rect x="19" y="19" width="17" height="17" fill="#8EBEB1"/>
  </svg>

  <div class="eyebrow-shapes">
    <span></span><span></span><span></span><span></span>
  </div>

  <h1>AI Studio widget staging</h1>
  <p>This page exists to test the AI Studio chat widget in isolation, outside of any production layout. Look for the widget launcher in the corner of the screen.</p>

  <div class="status">
    <span class="dot"></span>
    <span>Widget script loading</span>
  </div>
</div>

<ai-studio-widget widget-id="wgt_gold_68d12ed7"></ai-studio-widget>
<script src="https://widget.8x8.studio/v1/ai-studio-widget.js" async></script>

<script>
// Best-effort: insert a small avatar before the agent name "Ira" in the
// widget header. Only works if the widget's shadow root is OPEN — if it's
// closed, this silently does nothing (there is no workaround for that case).
(function () {
  function findNameNode(root, targetText) {
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
    var node;
    while ((node = walker.nextNode())) {
      if (node.shadowRoot) {
        var found = findNameNode(node.shadowRoot, targetText);
        if (found) return found;
      }
      if (node.children.length === 0 && node.textContent.trim() === targetText) {
        return node;
      }
    }
    return null;
  }

  function injectAvatar() {
    var nameNode = findNameNode(document.body, 'Ira');
    if (!nameNode) return false;
    if (
      nameNode.previousElementSibling &&
      nameNode.previousElementSibling.classList &&
      nameNode.previousElementSibling.classList.contains('injected-avatar')
    ) {
      return true; // already injected
    }
    var avatar = document.createElement('span');
    avatar.className = 'injected-avatar';
    avatar.textContent = 'I';
    avatar.style.cssText =
      'display:inline-flex;align-items:center;justify-content:center;' +
      'width:24px;height:24px;border-radius:50%;background:#04888A;' +
      'color:#fff;font-size:12px;font-weight:700;margin-right:8px;' +
      'font-family:Arial,sans-serif;vertical-align:middle;flex-shrink:0;';
    nameNode.parentNode.insertBefore(avatar, nameNode);
    return true;
  }

  var attempts = 0;
  var maxAttempts = 40; // ~20s at 500ms intervals
  var interval = setInterval(function () {
    attempts++;
    if (injectAvatar() || attempts >= maxAttempts) {
      clearInterval(interval);
    }
  }, 500);
})();
</script>

</body>
</html>
